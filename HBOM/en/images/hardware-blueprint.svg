<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1680 560" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: rgb(26,26,26); }
    .title { font-size: 30px; font-weight: bold; }
    .label { font-size: 26px; }
    .small { font-size: 22px; fill: rgb(51,51,51); }
    .mono { font-family: 'Courier New', Courier, monospace; font-size: 24px; }
    .monosmall { font-family: 'Courier New', Courier, monospace; font-size: 20px; fill: rgb(51,51,51); }
  </style>
  <rect x="0" y="0" width="1680" height="560" style="fill:rgb(255,255,255);"/>

  <!-- Left panel: physical connection -->
  <text x="60" y="70" class="title">Physical connection</text>

  <!-- Devkit One board -->
  <rect x="60" y="130" width="330" height="220" style="fill:rgb(237,255,240);stroke:rgb(201,251,202);stroke-width:4;"/>
  <text x="225" y="230" text-anchor="middle" class="label">Acme Devkit One</text>
  <text x="225" y="266" text-anchor="middle" class="small">system board</text>

  <!-- Ribbon cable -->
  <line x1="390" y1="220" x2="560" y2="220" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <line x1="390" y1="232" x2="560" y2="232" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <line x1="390" y1="244" x2="560" y2="244" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <line x1="390" y1="256" x2="560" y2="256" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <text x="475" y="300" text-anchor="middle" class="small">ribbon cable</text>

  <!-- Touchkit module -->
  <rect x="560" y="130" width="330" height="220" style="fill:rgb(239,253,253);stroke:rgb(188,226,255);stroke-width:4;"/>
  <text x="725" y="230" text-anchor="middle" class="label">Touchkit Display Module</text>
  <text x="725" y="266" text-anchor="middle" class="small">optional, sold separately</text>

  <text x="60" y="440" class="small">No assembly contains both: the module sits outside the board and its enclosure.</text>
  <text x="60" y="478" class="small">The module still requires the board for power and signaling.</text>

  <!-- Divider -->
  <line x1="960" y1="40" x2="960" y2="520" style="stroke:rgb(188,226,255);stroke-width:3;"/>

  <!-- Right panel: physical blueprint -->
  <text x="1020" y="70" class="title">Physical blueprint</text>

  <!-- Asset: Devkit One -->
  <rect x="1020" y="150" width="230" height="220" style="fill:rgb(237,255,240);stroke:rgb(201,251,202);stroke-width:4;"/>
  <text x="1135" y="250" text-anchor="middle" class="mono">asset-devkit</text>
  <text x="1135" y="286" text-anchor="middle" class="monosmall">asm-devkit-one</text>

  <!-- Asset: Touchkit -->
  <rect x="1420" y="150" width="230" height="220" style="fill:rgb(239,253,253);stroke:rgb(188,226,255);stroke-width:4;"/>
  <text x="1535" y="250" text-anchor="middle" class="mono">asset-touchkit</text>
  <text x="1535" y="286" text-anchor="middle" class="monosmall">mod-touchkit</text>

  <!-- Flow: energy (devkit to touchkit) -->
  <text x="1335" y="196" text-anchor="middle" class="monosmall">energy</text>
  <line x1="1250" y1="208" x2="1400" y2="208" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <path d="M 1420 208 L 1398 198 L 1398 218 Z" style="fill:rgb(51,51,51);"/>

  <!-- Flow: data (devkit to touchkit) -->
  <text x="1335" y="252" text-anchor="middle" class="monosmall">data</text>
  <line x1="1250" y1="264" x2="1400" y2="264" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <path d="M 1420 264 L 1398 254 L 1398 274 Z" style="fill:rgb(51,51,51);"/>

  <!-- Flow: signal (touchkit to devkit) -->
  <text x="1335" y="308" text-anchor="middle" class="monosmall">signal</text>
  <line x1="1270" y1="320" x2="1420" y2="320" style="stroke:rgb(51,51,51);stroke-width:3;"/>
  <path d="M 1250 320 L 1272 310 L 1272 330 Z" style="fill:rgb(51,51,51);"/>

  <!-- Relationship: asset-touchkit dependsOn asset-devkit -->
  <path d="M 1535 370 L 1535 440 L 1135 440 L 1135 392" style="fill:none;stroke:rgb(51,51,51);stroke-width:3;stroke-dasharray:12,8;"/>
  <path d="M 1135 372 L 1125 394 L 1145 394 Z" style="fill:rgb(51,51,51);"/>
  <text x="1335" y="484" text-anchor="middle" class="mono">dependsOn</text>
</svg>
