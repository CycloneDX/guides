name: Generate Guide
run-name: >-
  Generate Guide
  ${{ inputs.document_type }}
  (${{ inputs.draft == 'false' && 'final' || 'draft' }})

on:
  workflow_dispatch:
    inputs:
      document_type:
        description: 'Select the type of guide to generate'
        required: true
        default: 'SBOM'
        type: choice
        options:
          - ALL
          - Attestations
          - CBOM
          - Design-Assurance
          - HBOM
          - MBOM
          - MLBOM
          - OBOM
          - SaaSBOM
          - SBOM
          - VEX_VDR
      draft:
        description: 'Stamp a diagonal DRAFT watermark on body pages'
        required: false
        default: true
        type: boolean

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        run: docker build -t cdx-guides-builder .

      - name: Create output directory
        run: mkdir -p docs

      - name: Run Docker container
        env:
          DOCUMENT_TYPE: ${{ github.event.inputs.document_type }}
          DRAFT_FLAG: ${{ github.event.inputs.draft == 'false' && '--final' || '' }}
        run: >-
          docker run
          -v "$(pwd)/docs:/workspace/docs"
          cdx-guides-builder
          "$DOCUMENT_TYPE"
          "$DRAFT_FLAG"

      - name: List files in docs directory
        run: ls -l docs

      - name: Upload .pdf files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docs/**
